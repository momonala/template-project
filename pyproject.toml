[project]
name = "project"
version = "0.1.0"
description = ""
authors = [{name = "Mohit Nalavadi"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "jupyter>=1.1.1",
    "notebook>=7.5.1",
    "pandas>=2.3.3",
    "ruff>=0.14.10",
    "isort>=7.0.0",
    "typer>=0.9.0",
]

[tool.config]
# ============================================================================
# NON-SECRET CONFIGURATION
# ============================================================================
# This section contains configuration values that are safe to version control.
# Secrets (API keys, tokens, passwords) should go in src/values.py (git-ignored).
#
# Uncomment and customize the sections you need for your project:

# Server settings (for Flask/web apps)
# flask_port = 5000
# server_url = "192.168.x.x"

# Database settings (paths only, not credentials)
# database_path = "data/app.db"

# MQTT settings (non-secret only)
# mqtt_port = 1883
# mqtt_topic = "your/topic/#"
# mqtt_broker_url = "192.168.x.x"

# Cloudflare tunnel settings
# tunnel_name = "your-tunnel-name"
# domain_suffix = "your-domain.com"

# Application-specific settings
# update_interval_min = 30
# default_location = "Berlin, DE"
# timeout_seconds = 60

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
config = "src.config:main"

[tool.black]
line-length = 110
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.isort]
force_single_line = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-s -v --cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
